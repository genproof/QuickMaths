name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Scrub (secrets, personal data, host paths, commit emails, history)
        run: python tools/scrub.py --all --authors --history
      - name: Lint
        run: ruff check .
      - name: Runtime manifest
        run: python tools/runtime_manifest.py --check
      - name: Tests (core, runtime, fleet, verify; offline)
        run: pytest
