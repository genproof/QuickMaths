[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quickmaths"
version = "0.1.0.dev0"
description = "Agentic harness that writes and officially verifies Lean 4 proofs, from single-round problems to multi-lane programs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
leh = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "runtime/tests", "fleet/tests", "verify/tests"]
pythonpath = ["src", "runtime"]
addopts = "-q --import-mode=importlib -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# runtime/, fleet/ and verify/ keep the compact style they were written in (deployed single files, no mass
# reformat); src/, tools/ and tests/ follow the full rule set.
"{runtime,fleet,verify}/**" = ["B007", "B023", "B034", "B905", "E401", "E402", "E701", "E702", "E731", "E741", "F401",
                   "F541", "I001", "SIM102", "SIM105", "SIM113", "SIM115", "SIM117", "UP017", "UP031", "UP033",
                   "UP035", "UP037"]
